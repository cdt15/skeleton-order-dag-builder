[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skelordag"
version = "0.1.0"
description = "Build a DAG by combining an undirected skeleton (PC algorithm) with a causal order (LiNGAM-type algorithm)."
readme = "README.md"
authors = [
    { name = "Takashi Ikeuchi" }
]
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "networkx",
    "lingam",
]

[project.urls]
Homepage = "https://github.com/cdt15/skeleton-order-dag-builder"

[tool.setuptools]
packages = ["skelordag"]
